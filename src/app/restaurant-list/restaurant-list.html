<ul class="rest-list">
  @for (restaurant of restaurants(); track restaurant.id) {
    <li>
      <div class="rest">
        <div class="rest-name">{{ restaurant.name }}</div>
        <div class="rest-descr">{{ restaurant.description }}</div>
        <div class="rest-address">{{ restaurant.address }}</div>
        <div class="rest-rate">{{ restaurant.rate }}</div>
        <div class="rest-status">{{ restaurant.status }}</div>
        <img class="rest-photo" ngSrc="/rest.png" width="1302" height="709" alt="Фото ресторана {{ restaurant.name }}" />
      </div>
    </li>
  } @empty {
    <li>Рестораны не найдены</li>
  }
</ul>
